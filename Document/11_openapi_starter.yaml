        pushToken: { type: string, minLength: 1, maxLength: 4096, writeOnly: true }
        platform: { type: string, minLength: 1, maxLength: 40, example: android }
        deviceName: { type: string, nullable: true, maxLength: 160 }
    NotificationDevice:
      type: object
