    SubscriptionDeliveryListResponse:
      type: object
      required: [success, data, errors]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: array
          items: { $ref: '#/components/schemas/SubscriptionDelivery' }
        message: { type: string, nullable: true }
        errors:
          type: array
          maxItems: 0
          items: { $ref: '#/components/schemas/ApiError' }
    ProductCategory:
      type: object
      required: [publicId, code, name, isActive]
      properties:
        publicId: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        isActive: { type: boolean }
    BranchAvailability:
      type: object
      required: [branchId, branchCode, branchName, isAvailable]
      properties:
        branchId: { type: string, format: uuid }
        branchCode: { type: string }
        branchName: { type: string }
        isAvailable: { type: boolean }
        maxDailyQuantity: { type: number, format: double, nullable: true, minimum: 0.001, multipleOf: 0.001 }
    Product:
      type: object
      required: [publicId, sku, name, category, unitOfMeasure, price, isActive, branchAvailability]
      properties:
        publicId: { type: string, format: uuid }
        sku: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        category: { $ref: '#/components/schemas/ProductCategory' }
        unitOfMeasure: { type: string, enum: [litre, kilogram, gram, piece] }
        price: { type: number, format: double, minimum: 0.01, multipleOf: 0.01 }
        isActive: { type: boolean }
        branchAvailability:
          type: array
          items: { $ref: '#/components/schemas/BranchAvailability' }
    Branch:
      type: object
      required: [publicId, code, name, city, state, isActive]
      properties:
        publicId: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        city: { type: string }
        state: { type: string }
        isActive: { type: boolean }
    UpsertProductRequest:
      type: object
      required: [sku, name, categoryId, unitOfMeasure, price]
      properties:
        sku: { type: string, maxLength: 80 }
        name: { type: string, maxLength: 160 }
        description: { type: string, nullable: true, maxLength: 1000 }
        categoryId: { type: string, format: uuid }
        unitOfMeasure: { type: string, enum: [litre, kilogram, gram, piece] }
        price: { type: number, format: double, exclusiveMinimum: 0, multipleOf: 0.01 }
    UpsertProductCategoryRequest:
      type: object
      required: [code, name]
      properties:
        code: { type: string, maxLength: 40 }
        name: { type: string, maxLength: 120 }
        description: { type: string, nullable: true, maxLength: 500 }
    SetProductBranchAvailabilityRequest:
      type: object
      required: [branchId, isAvailable]
      properties:
        branchId: { type: string, format: uuid }
        isAvailable: { type: boolean }
        maxDailyQuantity: { type: number, format: double, nullable: true, exclusiveMinimum: 0, multipleOf: 0.001 }
    UpdateCustomerProfileRequest:
      type: object
      properties:
        firstName: { type: string, maxLength: 100, nullable: true }
        lastName: { type: string, maxLength: 100, nullable: true }
        dateOfBirth: { type: string, format: date, nullable: true }
        gender: { type: string, maxLength: 40, nullable: true }
        alternateMobile: { type: string, maxLength: 20, nullable: true }
    CustomerAddressRequest:
      type: object
      required: [label, addressLine1, locality, city, state, pinCode, contactName, contactMobile, latitude, longitude, isDefault]
      properties:
        label: { type: string, maxLength: 80 }
        addressLine1: { type: string, maxLength: 200 }
        addressLine2: { type: string, maxLength: 200, nullable: true }
        locality: { type: string, maxLength: 120 }
        city: { type: string, maxLength: 100 }
        state: { type: string, maxLength: 100 }
        pinCode: { type: string, pattern: '^[1-9][0-9]{5}$' }
        landmark: { type: string, maxLength: 160, nullable: true }
        deliveryInstructions: { type: string, maxLength: 500, nullable: true }
        contactName: { type: string, maxLength: 160 }
        contactMobile: { type: string, maxLength: 20 }
        latitude: { type: number, format: double, minimum: -90, maximum: 90 }
        longitude: { type: number, format: double, minimum: -180, maximum: 180 }
        isDefault: { type: boolean }
    AddressLookupResult:
      type: object
      nullable: true
      properties:
        addressLine1: { type: string, nullable: true }
        locality: { type: string, nullable: true }
        city: { type: string, nullable: true }
        state: { type: string, nullable: true }
        pinCode: { type: string, nullable: true }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
    CheckoutRequest:
      type: object
      required: [addressId, items]
      properties:
        addressId:
          type: string
          format: uuid
        items:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: object
            required: [productId, quantity]
            properties:
              productId:
                type: string
                format: uuid
              quantity:
                type: number
                format: double
                minimum: 0.001
                multipleOf: 0.001
    CreateComplaintRequest:
      type: object
      required: [categoryId, description]
      properties:
        categoryId:
          type: string
          format: uuid
        description:
          type: string
          minLength: 5
          maxLength: 2000
