  /admin/setup/number-series:
    get:
      tags: [Number series setup]
      summary: List numbering series
      description: Requires SETUP.NUMBER_SERIES.READ. Returns every series with its counter, template, reset policy, activity flag, and the next number that would be allocated without consuming it.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Numbering series list envelope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NumberSeriesListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Number series setup]
      summary: Create a numbering series
      description: Requires SETUP.NUMBER_SERIES.MANAGE. The code is the stable lookup key used by business services and is immutable after creation.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateNumberSeriesRequest' }
      responses:
        '200':
          description: Numbering series created envelope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NumberSeriesResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/setup/number-series/preview:
    post:
      tags: [Number series setup]
      summary: Preview a template without consuming the counter
      description: Requires SETUP.NUMBER_SERIES.READ. Renders the candidate template; the optional nextNumber overrides the counter value. The live series counter is never advanced.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NumberSeriesPreviewRequest' }
      responses:
        '200':
          description: Template preview envelope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NumberSeriesPreviewResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/setup/number-series/{code}:
    get:
      tags: [Number series setup]
      summary: Get a numbering series by code
      description: Requires SETUP.NUMBER_SERIES.READ.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/numberSeriesCode'
      responses:
        '200':
          description: Numbering series envelope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NumberSeriesResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Number series setup]
      summary: Update a numbering series
      description: Requires SETUP.NUMBER_SERIES.MANAGE. The code is fixed by the route. Counter, template, and reset policy are validated together; lowering the starting number below the last used number is rejected.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/numberSeriesCode'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateNumberSeriesRequest' }
      responses:
        '200':
          description: Numbering series updated envelope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NumberSeriesResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/setup/number-series/{code}/activate:
    post:
      tags: [Number series setup]
      summary: Activate a numbering series
      description: Requires SETUP.NUMBER_SERIES.MANAGE. Changing the active flag does not reset the counter.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/numberSeriesCode'
      responses:
        '200':
          description: Numbering series activated envelope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NumberSeriesResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/setup/number-series/{code}/deactivate:
    post:
      tags: [Number series setup]
      summary: Deactivate a numbering series
      description: Requires SETUP.NUMBER_SERIES.MANAGE. A deactivated series cannot be allocated; allocating business services fail rather than skipping the series.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/numberSeriesCode'
      responses:
        '200':
          description: Numbering series deactivated envelope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NumberSeriesResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /webhooks/razorpay:
    post:
      summary: Razorpay webhook
      security: []
      responses:
        '200': { description: Webhook accepted }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    categoryIdQuery:
      name: categoryId
      in: query
      required: false
      schema: { type: string, format: uuid }
    productId:
      name: productId
      in: path
      required: true
      schema: { type: string, format: uuid }
    categoryId:
      name: categoryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    customerId:
      name: customerId
      in: path
      required: true
      schema: { type: string, format: uuid }
    addressId:
      name: addressId
      in: path
      required: true
      schema: { type: string, format: uuid }
    orderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    subscriptionId:
      name: subscriptionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    deliveryId:
      name: deliveryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    milkTestId:
      name: milkTestId
      in: path
      required: true
      schema: { type: string, format: uuid }
    milkTestImageId:
      name: imageId
      in: path
      required: true
      schema: { type: string, format: uuid }
    cameraId:
      name: cameraId
      in: path
      required: true
      schema: { type: string, format: uuid }
    notificationId:
      name: notificationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    notificationTemplateId:
      name: templateId
      in: path
      required: true
      schema: { type: string, format: uuid }
    notificationPage:
      name: page
      in: query
      required: false
      schema: { type: integer, format: int32, minimum: 1, default: 1 }
    notificationPageSize:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, format: int32, minimum: 1, maximum: 100, default: 20 }
    notificationIsRead:
      name: isRead
      in: query
      required: false
      schema: { type: boolean }
    cameraBranchId:
      name: branchId
      in: query
      required: false
      description: Optional branch filter; authorization remains server-enforced.
      schema: { type: integer, format: int64, minimum: 1 }
    numberSeriesCode:
      name: code
      in: path
      required: true
      description: Stable numbering-series code, for example CUSTOMER.
      schema: { type: string, minLength: 1, maxLength: 40 }
    deliveryBranchId:
      name: branchId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    dairyBranchId:
      name: branchId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    batchId:
      name: batchId
      in: path
      required: true
      schema: { type: string, format: uuid }
    productionDate:
      name: productionDate
      in: query
      required: false
      schema: { type: string, format: date }
    fromDate:
      name: fromDate
      in: query
      required: false
      schema: { type: string, format: date }
    toDate:
      name: toDate
      in: query
      required: false
      schema: { type: string, format: date }
    batchStatus:
      name: status
      in: query
      required: false
      schema: { $ref: '#/components/schemas/MilkBatchStatus' }
    deliveryDate:
      name: date
      in: query
      required: false
      schema: { type: string, format: date }
    deliveryStatus:
      name: status
      in: query
      required: false
      schema: { $ref: '#/components/schemas/DeliveryStatus' }
    deliverySourceType:
      name: sourceType
      in: query
      required: false
      schema: { $ref: '#/components/schemas/DeliverySourceType' }
    subscriptionSlot:
      name: slot
      in: query
      required: false
      description: Morning or Evening subscription delivery slot. One-time deliveries do not have a slot.
      schema: { $ref: '#/components/schemas/SubscriptionDeliverySlot' }
    throughDate:
      name: throughDate
      in: query
      required: true
      description: Inclusive India-local generation date. Must be today or later and no later than the final day of the configured operational generation window.
      schema: { type: string, format: date }
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated key used to make subscription creation idempotent.
      schema: { type: string, minLength: 1, maxLength: 100 }
    reportFrom:
      name: dateRange.from
      in: query
      required: false
      description: Inclusive India-local start boundary of the report range. The value is a wall-clock timestamp in Asia/Kolkata without an offset; the server compares it using a half-open range.
      schema: { type: string, format: date-time }
    reportTo:
      name: dateRange.to
      in: query
      required: false
      description: Exclusive India-local end boundary of the report range. The value is a wall-clock timestamp in Asia/Kolkata without an offset.
      schema: { type: string, format: date-time }
    reportBranchIds:
      name: branchIds
      in: query
      required: false
      description: Repeated public branch identifiers; server authorization intersects them with the actor's scope.
      style: form
      explode: true
      schema: { type: array, items: { type: string, format: uuid } }
    reportSearch:
      name: search
      in: query
      required: false
      schema: { type: string }
    reportStatuses:
      name: statuses
      in: query
      required: false
      style: form
      explode: true
      schema: { type: array, items: { type: string } }
    reportCustomerId:
      name: customerId
      in: query
      required: false
      schema: { type: string, format: uuid }
    reportEmployeeId:
      name: employeeId
      in: query
      required: false
      schema: { type: string, format: uuid }
    reportProductId:
      name: productId
      in: query
      required: false
      schema: { type: string, format: uuid }
    reportPaymentState:
      name: paymentState
      in: query
      required: false
      schema: { type: string }
    reportPage:
      name: page
      in: query
      required: false
      schema: { type: integer, format: int32, minimum: 1, default: 1 }
    reportPageSize:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, format: int32, minimum: 1, maximum: 250, default: 50 }
    reportSortBy:
      name: sortBy
      in: query
      required: false
      schema: { type: string }
    reportSortDirection:
      name: sortDirection
      in: query
      required: false
      schema: { $ref: '#/components/schemas/ReportSortDirection' }
  requestBodies:
    ReportExportRequest:
      description: Report filters and requested server-generated file format.
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ReportExportRequest' }
  responses:
    ReportExportFile:
      description: Server-generated report file. Content-Disposition supplies the normalized download filename.
      headers:
        Content-Disposition:
          description: Attachment disposition with the server-selected filename.
          schema: { type: string }
        X-Report-Row-Count:
          description: Number of exported report rows.
          schema: { type: integer, format: int32, minimum: 0 }
      content:
        text/csv:
          schema: { type: string, format: binary }
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
          schema: { type: string, format: binary }
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Authentication is required or the access token is invalid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: The authenticated user lacks the required permission
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: The owned resource was not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: The request conflicts with existing state or an idempotency key was reused with different input
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    BusinessRuleError:
      description: A subscription, entitlement, cutoff, availability, or payment business rule failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    ApiError:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        field: { type: string, nullable: true }
        message: { type: string }
    ErrorResponse:
      type: object
      required: [success, errors]
      properties:
        success: { type: boolean, enum: [false] }
        data: { nullable: true }
        message: { type: string, nullable: true }
        errors:
          type: array
          items: { $ref: '#/components/schemas/ApiError' }
    NotificationChannel:
      type: string
      enum: [Push, Sms, WhatsApp, Email]
    NotificationListItem:
      type: object
      required: [notificationId, eventType, title, body, isRead, createdAt]
      properties:
        notificationId: { type: string, format: uuid }
        eventType: { type: string }
        title: { type: string }
        body: { type: string }
        deepLink: { type: string, nullable: true, description: Internal application route validated by the client allowlist. }
        isRead: { type: boolean }
        createdAt: { type: string, format: date-time }
        readAt: { type: string, format: date-time, nullable: true }
    NotificationPage:
      type: object
      required: [items, page, pageSize, totalCount]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/NotificationListItem' }
        page: { type: integer, format: int32, minimum: 1 }
        pageSize: { type: integer, format: int32, minimum: 1, maximum: 100 }
        totalCount: { type: integer, format: int32, minimum: 0 }
