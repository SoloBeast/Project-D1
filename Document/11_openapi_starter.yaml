      security:
        - bearerAuth: []
      responses:
        '200':
          description: Effective event and channel preferences, including critical-event status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreferenceListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [Notification preferences]
      summary: Update one notification event and channel preference
      description: Critical notification event preferences cannot be disabled.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateNotificationPreferenceRequest' }
      responses:
        '200':
          description: Notification preference updated
