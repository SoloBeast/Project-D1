      security: []
      responses:
        '200': { description: Webhook accepted }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    categoryIdQuery:
      name: categoryId
      in: query
      required: false
      schema: { type: string, format: uuid }
    productId:
      name: productId
      in: path
      required: true
      schema: { type: string, format: uuid }
    categoryId:
      name: categoryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    customerId:
      name: customerId
      in: path
      required: true
      schema: { type: string, format: uuid }
    addressId:
      name: addressId
      in: path
      required: true
      schema: { type: string, format: uuid }
    orderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    subscriptionId:
      name: subscriptionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    deliveryId:
      name: deliveryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    milkTestId:
      name: milkTestId
      in: path
      required: true
      schema: { type: string, format: uuid }
    milkTestImageId:
      name: imageId
      in: path
      required: true
      schema: { type: string, format: uuid }
    deliveryBranchId:
      name: branchId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    dairyBranchId:
      name: branchId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    batchId:
      name: batchId
      in: path
      required: true
      schema: { type: string, format: uuid }
    productionDate:
      name: productionDate
      in: query
      required: false
      schema: { type: string, format: date }
    fromDate:
      name: fromDate
      in: query
      required: false
      schema: { type: string, format: date }
    toDate:
      name: toDate
      in: query
      required: false
      schema: { type: string, format: date }
    batchStatus:
      name: status
      in: query
      required: false
      schema: { $ref: '#/components/schemas/MilkBatchStatus' }
    deliveryDate:
      name: date
      in: query
      required: false
      schema: { type: string, format: date }
    deliveryStatus:
      name: status
      in: query
      required: false
      schema: { $ref: '#/components/schemas/DeliveryStatus' }
    throughDate:
      name: throughDate
      in: query
      required: true
      schema: { type: string, format: date }
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated key used to make subscription creation idempotent.
      schema: { type: string, minLength: 1, maxLength: 100 }
  responses:
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Authentication is required or the access token is invalid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: The authenticated user lacks the required permission
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: The owned resource was not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: The request conflicts with existing state or an idempotency key was reused with different input
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    BusinessRuleError:
      description: A subscription, entitlement, cutoff, availability, or payment business rule failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    ApiError:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        field: { type: string, nullable: true }
        message: { type: string }
    ErrorResponse:
      type: object
      required: [success, errors]
      properties:
        success: { type: boolean, enum: [false] }
        data: { nullable: true }
        message: { type: string, nullable: true }
        errors:
          type: array
          items: { $ref: '#/components/schemas/ApiError' }
    RecordMilkProductionRequest:
      type: object
      required: [productionAtUtc, buffaloCount, quantityProduced, unit]
      properties:
        productionAtUtc: { type: string, format: date-time, description: UTC timestamp; cannot be more than five minutes in the future. }
        shift: { type: string, nullable: true, maxLength: 40 }
        buffaloCount: { type: integer, format: int32, minimum: 1 }
        quantityProduced: { type: number, format: double, exclusiveMinimum: 0, multipleOf: 0.001 }
        unit: { type: string, enum: [L, LITRE, LITRES], description: Accepted case-insensitively and normalized to L. }
        remarks: { type: string, nullable: true, maxLength: 1000 }
    RecordMilkUsageRequest:
      type: object
      required: [usedAtUtc, quantityUsed, purpose]
      properties:
        usedAtUtc: { type: string, format: date-time, description: UTC timestamp; must not precede production or be more than five minutes in the future. }
        quantityUsed: { type: number, format: double, exclusiveMinimum: 0, multipleOf: 0.001 }
        purpose: { type: string, minLength: 1, maxLength: 120 }
        remarks: { type: string, nullable: true, maxLength: 1000 }
    MilkBatchStatus:
      type: string
      enum: [Available, Exhausted]
    MilkProduction:
      type: object
      required: [publicId, branchId, productionAtUtc, buffaloCount, quantityProduced, unit, recordedByUserId, createdAtUtc, batch]
      properties:
        publicId: { type: string, format: uuid }
        branchId: { type: integer, format: int64 }
        productionAtUtc: { type: string, format: date-time }
        shift: { type: string, nullable: true }
        buffaloCount: { type: integer, format: int32, minimum: 0 }
        quantityProduced: { type: number, format: double, minimum: 0.001, multipleOf: 0.001 }
        unit: { type: string, enum: [L] }
        recordedByUserId: { type: integer, format: int64 }
        remarks: { type: string, nullable: true }
        createdAtUtc: { type: string, format: date-time }
        batch: { $ref: '#/components/schemas/MilkBatch' }
    MilkBatch:
      type: object
      required: [publicId, batchNumber, branchId, productionPublicId, productionAtUtc, quantityProduced, availableQuantity, unit, status, createdAtUtc]
      properties:
        publicId: { type: string, format: uuid }
        batchNumber: { type: string }
