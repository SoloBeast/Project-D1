    RecordMilkProductionRequest:
      type: object
      required: [productionAt, buffaloCount, quantityProduced, unit]
      properties:
        productionAt: { type: string, format: date-time, description: India-local business timestamp represented on the wire as a UTC instant; cannot be more than five minutes in the future. }
        shift: { type: string, nullable: true, maxLength: 40 }
        buffaloCount: { type: integer, format: int32, minimum: 1 }
        quantityProduced: { type: number, format: double, exclusiveMinimum: 0, multipleOf: 0.001 }
        unit: { type: string, enum: [L, LITRE, LITRES], description: Accepted case-insensitively and normalized to L. }
        remarks: { type: string, nullable: true, maxLength: 1000 }
    RecordMilkUsageRequest:
      type: object
      required: [usedAt, quantityUsed, purpose]
      properties:
        usedAt: { type: string, format: date-time, description: India-local business timestamp represented on the wire as a UTC instant; must not precede production or be more than five minutes in the future. }
        quantityUsed: { type: number, format: double, exclusiveMinimum: 0, multipleOf: 0.001 }
        purpose: { type: string, minLength: 1, maxLength: 120 }
        remarks: { type: string, nullable: true, maxLength: 1000 }
    MilkBatchStatus:
      type: string
