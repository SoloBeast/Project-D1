openapi: 3.0.3
info:
  title: DoodhDirect API
  version: 1.0.0
  description: Farm-to-home dairy platform API.
servers:
  - url: https://api.example.com/api/v1
paths:
  /customers/me:
    get:
      summary: Get the authenticated customer's profile
      security:
        - bearerAuth: []
      responses:
        '200': { description: Customer profile envelope }
        '401': { description: Authentication required }
    patch:
      summary: Update the authenticated customer's profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerProfileRequest'
      responses:
        '200': { description: Updated customer profile envelope }
        '400': { description: Validation error }
  /customers/me/addresses:
    get:
      summary: List the authenticated customer's active addresses
      security:
        - bearerAuth: []
      responses:
        '200': { description: Address list envelope }
    post:
      summary: Create an address for the authenticated customer
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerAddressRequest'
      responses:
        '200': { description: Created address envelope }
        '400': { description: Validation error }
  /customers/me/addresses/{addressId}:
    get:
      summary: Get one owned customer address
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/addressId'
      responses:
        '200': { description: Address envelope }
        '404': { description: Address not found }
    patch:
      summary: Update one owned customer address
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/addressId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerAddressRequest'
      responses:
        '200': { description: Updated address envelope }
        '400': { description: Validation error }
        '404': { description: Address not found }
    delete:
      summary: Deactivate one owned customer address
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/addressId'
      responses:
        '200': { description: Address deactivated }
        '404': { description: Address not found }
  /customers/me/address-lookup/reverse:
    get:
      summary: Reverse geocode a map pin for address entry
      security:
        - bearerAuth: []
      parameters:
        - name: latitude
          in: query
          required: true
          schema: { type: number, format: double, minimum: -90, maximum: 90 }
        - name: longitude
          in: query
          required: true
          schema: { type: number, format: double, minimum: -180, maximum: 180 }
      responses:
        '200': { description: Optional provider lookup result }
        '400': { description: Invalid coordinates }
  /admin/customers/{customerId}/profile:
    get:
      summary: Read a customer profile
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/customerId'
      responses:
        '200': { description: Customer profile envelope }
        '403': { description: Missing customer read permission }
    patch:
      summary: Manage a customer profile
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/customerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerProfileRequest'
      responses:
        '200': { description: Updated customer profile envelope }
        '403': { description: Missing customer manage permission }
  /admin/customers/{customerId}/addresses:
    get:
      summary: Read customer addresses
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/customerId'
      responses:
        '200': { description: Address list envelope }
    post:
      summary: Create a customer address
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/customerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerAddressRequest'
      responses:
        '200': { description: Created address envelope }
  /admin/customers/{customerId}/addresses/{addressId}:
    get:
      summary: Read one customer address
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/customerId'
        - $ref: '#/components/parameters/addressId'
      responses:
        '200': { description: Address envelope }
    patch:
      summary: Update one customer address
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/customerId'
        - $ref: '#/components/parameters/addressId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerAddressRequest'
      responses:
        '200': { description: Updated address envelope }
    delete:
      summary: Deactivate one customer address
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/customerId'
        - $ref: '#/components/parameters/addressId'
      responses:
        '200': { description: Address deactivated }
  /auth/send-otp:
    post:
      summary: Send OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mobile]
              properties:
                mobile:
                  type: string
                  example: "+919876543210"
      responses:
        '202':
          description: OTP request accepted
  /products:
    get:
      summary: List active catalogue products
      description: Anonymous catalogue read. Results require an active product, active category, and an available active branch.
      security: []
      parameters:
        - $ref: '#/components/parameters/categoryIdQuery'
      responses:
        '200': { description: Product list envelope }
  /products/{productId}:
    get:
      summary: Get one active catalogue product
      security: []
      parameters:
        - $ref: '#/components/parameters/productId'
      responses:
        '200': { description: Product envelope }
        '404': { description: Product not found or unavailable }
  /product-categories:
    get:
      summary: List active product categories
      security: []
      responses:
        '200': { description: Category list envelope }
  /admin/products:
    get:
      summary: List products for catalogue administration
      security:
        - bearerAuth: []
      responses:
        '200': { description: Product list envelope }
        '403': { description: Missing CATALOGUE.READ permission }
    post:
      summary: Create a catalogue product
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertProductRequest'
      responses:
        '200': { description: Created product envelope }
        '400': { description: Validation error }
        '403': { description: Missing CATALOGUE.MANAGE permission }
        '409': { description: Duplicate SKU }
  /admin/products/{productId}:
    get:
      summary: Get one product for catalogue administration
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/productId'
      responses:
        '200': { description: Product envelope }
        '403': { description: Missing CATALOGUE.READ permission }
        '404': { description: Product not found }
    patch:
      summary: Update a catalogue product
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/productId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertProductRequest'
      responses:
        '200': { description: Updated product envelope }
        '400': { description: Validation error }
        '403': { description: Missing CATALOGUE.MANAGE permission }
        '404': { description: Product not found }
        '409': { description: Duplicate SKU }
  /admin/products/{productId}/activate:
    post:
      summary: Activate a catalogue product
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/productId'
      responses:
        '200': { description: Product envelope }
        '403': { description: Missing CATALOGUE.MANAGE permission }
        '422': { description: Active category required }
  /admin/products/{productId}/deactivate:
    post:
      summary: Deactivate a catalogue product
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/productId'
      responses:
        '200': { description: Product envelope }
        '403': { description: Missing CATALOGUE.MANAGE permission }
  /admin/products/{productId}/branches:
    put:
      summary: Set product availability for a branch
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/productId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetProductBranchAvailabilityRequest'
      responses:
        '200': { description: Updated product envelope }
        '400': { description: Validation error }
        '403': { description: Missing CATALOGUE.MANAGE permission }
        '404': { description: Product or branch not found }
  /admin/product-categories:
    get:
      summary: List all categories for catalogue administration
      security:
        - bearerAuth: []
      responses:
        '200': { description: Category list envelope }
        '403': { description: Missing CATALOGUE.READ permission }
    post:
      summary: Create a product category
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertProductCategoryRequest'
      responses:
        '200': { description: Created category envelope }
        '400': { description: Validation error }
        '403': { description: Missing CATALOGUE.MANAGE permission }
        '409': { description: Duplicate category code }
  /admin/product-categories/{categoryId}:
    patch:
      summary: Update a product category
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/categoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertProductCategoryRequest'
      responses:
        '200': { description: Updated category envelope }
        '400': { description: Validation error }
        '403': { description: Missing CATALOGUE.MANAGE permission }
        '404': { description: Category not found }
  /admin/product-categories/{categoryId}/activate:
    post:
      summary: Activate a product category
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/categoryId'
      responses:
        '200': { description: Category envelope }
        '403': { description: Missing CATALOGUE.MANAGE permission }
  /admin/product-categories/{categoryId}/deactivate:
    post:
      summary: Deactivate a product category
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/categoryId'
      responses:
        '200': { description: Category envelope }
        '403': { description: Missing CATALOGUE.MANAGE permission }
  /admin/branches:
    get:
      summary: List branches for catalogue administration
      security:
        - bearerAuth: []
      responses:
        '200': { description: Branch list envelope }
        '403': { description: Missing CATALOGUE.READ permission }
  /branches/serviceability:
    get:
      summary: Check serviceability and eligible branches
      security:
        - bearerAuth: []
      parameters:
        - name: latitude
          in: query
          required: true
          schema: { type: number, format: double }
        - name: longitude
          in: query
          required: true
          schema: { type: number, format: double }
      responses:
        '200':
          description: Serviceability result
  /orders/checkout-preview:
    post:
      summary: Calculate authoritative checkout totals and allocate the nearest eligible branch
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '200': { description: Checkout preview with backend prices, totals, and branch allocation }
        '404': { description: Selected owned active address not found }
        '422': { description: Product or branch allocation business rule failure }
  /orders:
    post:
      summary: Create a confirmed one-time order
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '201': { description: Idempotent order result }
        '404': { description: Selected owned active address not found }
        '422': { description: Product or branch allocation business rule failure }
    get:
      summary: List the authenticated customer's orders
      security:
        - bearerAuth: []
      responses:
        '200': { description: Ownership-scoped order list }
  /orders/{orderId}:
    get:
      summary: Get an owned order
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/orderId'
      responses:
        '200': { description: Historical order snapshot }
        '404': { description: Owned order not found }
  /orders/{orderId}/cancel:
    post:
      summary: Cancel an owned eligible order
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/orderId'
      responses:
        '200': { description: Cancelled order snapshot }
        '404': { description: Owned order not found }
        '422': { description: Order status cannot transition to cancelled }
  /admin/orders:
    get:
      summary: List orders for authorized administration
      security:
        - bearerAuth: []
      responses:
        '200': { description: Administrative order list }
        '403': { description: Missing ORDERS.READ permission }
  /admin/orders/{orderId}:
    get:
      summary: Get an order for authorized administration
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/orderId'
      responses:
        '200': { description: Historical order snapshot }
        '403': { description: Missing ORDERS.READ permission }
        '404': { description: Order not found }
  /orders/{orderId}/complaints:
    post:
      summary: Create complaint for delivered order
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/orderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateComplaintRequest'
      responses:
        '201': { description: Complaint created }
        '422': { description: Complaint window/business rule failure }
  /subscriptions:
    get:
      summary: List the authenticated customer's subscriptions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Ownership-scoped subscription list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Create a prepaid finite-entitlement subscription
      description: Creates one subscription and its single associated Wallet or Razorpay payment. Retrying the same request requires the same idempotency key.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSubscriptionRequest' }
      responses:
        '201':
          description: Subscription and its reusable payment were created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedSubscriptionResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/BusinessRuleError' }
  /subscriptions/{subscriptionId}:
    get:
      summary: Get an owned subscription
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/subscriptionId'
      responses:
        '200':
          description: Subscription snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Update an owned eligible subscription
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/subscriptionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateSubscriptionRequest' }
      responses:
        '200':
          description: Updated subscription snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/BusinessRuleError' }
  /subscriptions/{subscriptionId}/pause:
    post:
      summary: Pause an owned active subscription
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/subscriptionId'
      responses:
        '200':
          description: Paused subscription snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/BusinessRuleError' }
  /subscriptions/{subscriptionId}/resume:
    post:
      summary: Resume an owned paused subscription
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/subscriptionId'
      responses:
        '200':
          description: Resumed subscription snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/BusinessRuleError' }
  /subscriptions/{subscriptionId}/cancel:
    post:
      summary: Cancel an owned eligible subscription
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/subscriptionId'
      responses:
        '200':
          description: Cancelled subscription snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/BusinessRuleError' }
  /subscriptions/{subscriptionId}/skip:
    post:
      summary: Skip one scheduled delivery for an owned subscription
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/subscriptionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SkipSubscriptionDeliveryRequest' }
      responses:
        '200':
          description: Skipped subscription delivery snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionDeliveryResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/BusinessRuleError' }
  /subscriptions/{subscriptionId}/calendar:
    get:
      summary: List the delivery calendar and history for an owned subscription
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/subscriptionId'
      responses:
        '200':
          description: Subscription delivery calendar and history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionDeliveryListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /delivery/{deliveryId}/verify-otp:
    post:
      summary: Verify delivery OTP
      security:
        - bearerAuth: []
      parameters:
        - name: deliveryId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [otp]
              properties:
                otp: { type: string, minLength: 4, maxLength: 8 }
      responses:
        '200': { description: OTP verified }
        '422': { description: Invalid/expired OTP }
  /webhooks/razorpay:
    post:
      summary: Razorpay webhook
      security: []
      responses:
        '200': { description: Webhook accepted }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    categoryIdQuery:
      name: categoryId
      in: query
      required: false
      schema: { type: string, format: uuid }
    productId:
      name: productId
      in: path
      required: true
      schema: { type: string, format: uuid }
    categoryId:
      name: categoryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    customerId:
      name: customerId
      in: path
      required: true
      schema: { type: string, format: uuid }
    addressId:
      name: addressId
      in: path
      required: true
      schema: { type: string, format: uuid }
    orderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    subscriptionId:
      name: subscriptionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated key used to make subscription creation idempotent.
      schema: { type: string, minLength: 1, maxLength: 100 }
  responses:
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Authentication is required or the access token is invalid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: The authenticated user lacks the required permission
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: The owned resource was not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: The request conflicts with existing state or an idempotency key was reused with different input
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    BusinessRuleError:
      description: A subscription, entitlement, cutoff, availability, or payment business rule failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    ApiError:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        field: { type: string, nullable: true }
        message: { type: string }
    ErrorResponse:
      type: object
      required: [success, errors]
      properties:
        success: { type: boolean, enum: [false] }
        data: { nullable: true }
        message: { type: string, nullable: true }
        errors:
          type: array
          items: { $ref: '#/components/schemas/ApiError' }
    CreateSubscriptionRequest:
      type: object
      required: [productId, addressId, quantity, startDate, deliveryDays, totalEntitlement, paymentMethod]
      properties:
        productId: { type: string, format: uuid }
        addressId: { type: string, format: uuid }
        quantity: { type: number, format: double, minimum: 0.001, multipleOf: 0.001 }
        startDate: { type: string, format: date, description: Must not be in the past. }
        deliveryDays:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/DeliveryWeekday' }
        totalEntitlement: { type: integer, format: int32, minimum: 1, maximum: 366 }
        paymentMethod: { $ref: '#/components/schemas/PaymentMethod' }
    UpdateSubscriptionRequest:
      type: object
      properties:
        quantity: { type: number, format: double, nullable: true, minimum: 0.001, multipleOf: 0.001 }
        addressId: { type: string, format: uuid, nullable: true }
        deliveryDays:
          type: array
          nullable: true
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/DeliveryWeekday' }
    SkipSubscriptionDeliveryRequest:
      type: object
      required: [deliveryId]
      properties:
        deliveryId: { type: string, format: uuid }
    DeliveryWeekday:
      type: string
      enum: [Sunday, Monday, Tuesday, Wednesday, Thursday, Friday, Saturday]
    PaymentMethod:
      type: string
      enum: [Razorpay, Wallet]
    PaymentStatus:
      type: string
      enum: [Initiated, Pending, Success, Failed, Expired, RefundPending, PartiallyRefunded, Refunded]
    SubscriptionStatus:
      type: string
      enum: [PaymentPending, Active, Paused, Completed, Cancelled, PaymentFailed]
    SubscriptionDeliveryStatus:
      type: string
      enum: [Scheduled, Skipped, Delivered, Failed, Cancelled]
    SubscriptionSchedule:
      type: object
      required: [dayOfWeek]
      properties:
        dayOfWeek: { $ref: '#/components/schemas/DeliveryWeekday' }
    SubscriptionDelivery:
      type: object
      required: [publicId, scheduledDate, quantity, status, branchId, branchCode, branchName, address]
      properties:
        publicId: { type: string, format: uuid }
        scheduledDate: { type: string, format: date }
        quantity: { type: number, format: double, minimum: 0.001, multipleOf: 0.001 }
        status: { $ref: '#/components/schemas/SubscriptionDeliveryStatus' }
        branchId: { type: string, format: uuid }
        branchCode: { type: string }
        branchName: { type: string }
        address: { type: string }
        statusChangedAtUtc: { type: string, format: date-time, nullable: true }
    Subscription:
      type: object
      required: [publicId, status, productId, productSku, productName, unitOfMeasure, quantity, unitPrice, payableAmount, startDate, endDate, totalEntitlement, usedEntitlement, remainingEntitlement, addressId, address, branchId, branchCode, branchName, schedules, createdAtUtc]
      properties:
        publicId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/SubscriptionStatus' }
        productId: { type: string, format: uuid }
        productSku: { type: string }
        productName: { type: string }
        unitOfMeasure: { type: string }
        quantity: { type: number, format: double, minimum: 0.001, multipleOf: 0.001 }
        unitPrice: { type: number, format: double, minimum: 0 }
        payableAmount: { type: number, format: double, minimum: 0 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        totalEntitlement: { type: integer, format: int32, minimum: 1, maximum: 366 }
        usedEntitlement: { type: integer, format: int32, minimum: 0 }
        remainingEntitlement: { type: integer, format: int32, minimum: 0 }
        addressId: { type: string, format: uuid }
        address: { type: string }
        branchId: { type: string, format: uuid }
        branchCode: { type: string }
        branchName: { type: string }
        schedules:
          type: array
          items: { $ref: '#/components/schemas/SubscriptionSchedule' }
        activatedAtUtc: { type: string, format: date-time, nullable: true }
        pausedAtUtc: { type: string, format: date-time, nullable: true }
        cancelledAtUtc: { type: string, format: date-time, nullable: true }
        completedAtUtc: { type: string, format: date-time, nullable: true }
        createdAtUtc: { type: string, format: date-time }
    Payment:
      type: object
      required: [publicId, method, status, amount, refundedAmount, currency, expiresAtUtc, createdAtUtc]
      properties:
        publicId: { type: string, format: uuid }
        orderId: { type: string, format: uuid, nullable: true }
        orderNumber: { type: string, nullable: true }
        method: { $ref: '#/components/schemas/PaymentMethod' }
        status: { $ref: '#/components/schemas/PaymentStatus' }
        amount: { type: number, format: double, minimum: 0 }
        refundedAmount: { type: number, format: double, minimum: 0 }
        currency: { type: string, example: INR }
        gatewayOrderId: { type: string, nullable: true }
        gatewayPaymentId: { type: string, nullable: true }
        gatewayKeyId: { type: string, nullable: true }
        failureCode: { type: string, nullable: true }
        failureMessage: { type: string, nullable: true }
        expiresAtUtc: { type: string, format: date-time }
        verifiedAtUtc: { type: string, format: date-time, nullable: true }
        createdAtUtc: { type: string, format: date-time }
        subscriptionId: { type: string, format: uuid, nullable: true }
    CreatedSubscription:
      type: object
      required: [subscription, payment]
      properties:
        subscription: { $ref: '#/components/schemas/Subscription' }
        payment: { $ref: '#/components/schemas/Payment' }
    SubscriptionResponse:
      type: object
      required: [success, data, errors]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: '#/components/schemas/Subscription' }
        message: { type: string, nullable: true }
        errors:
          type: array
          maxItems: 0
          items: { $ref: '#/components/schemas/ApiError' }
    SubscriptionListResponse:
      type: object
      required: [success, data, errors]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: array
          items: { $ref: '#/components/schemas/Subscription' }
        message: { type: string, nullable: true }
        errors:
          type: array
          maxItems: 0
          items: { $ref: '#/components/schemas/ApiError' }
    CreatedSubscriptionResponse:
      type: object
      required: [success, data, errors]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: '#/components/schemas/CreatedSubscription' }
        message: { type: string, nullable: true }
        errors:
          type: array
          maxItems: 0
          items: { $ref: '#/components/schemas/ApiError' }
    SubscriptionDeliveryResponse:
      type: object
      required: [success, data, errors]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: '#/components/schemas/SubscriptionDelivery' }
        message: { type: string, nullable: true }
        errors:
          type: array
          maxItems: 0
          items: { $ref: '#/components/schemas/ApiError' }
    SubscriptionDeliveryListResponse:
      type: object
      required: [success, data, errors]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: array
          items: { $ref: '#/components/schemas/SubscriptionDelivery' }
        message: { type: string, nullable: true }
        errors:
          type: array
          maxItems: 0
          items: { $ref: '#/components/schemas/ApiError' }
    ProductCategory:
      type: object
      required: [publicId, code, name, isActive]
      properties:
        publicId: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        isActive: { type: boolean }
    BranchAvailability:
      type: object
      required: [branchId, branchCode, branchName, isAvailable]
      properties:
        branchId: { type: string, format: uuid }
        branchCode: { type: string }
        branchName: { type: string }
        isAvailable: { type: boolean }
        maxDailyQuantity: { type: number, format: double, nullable: true, minimum: 0.001, multipleOf: 0.001 }
    Product:
      type: object
      required: [publicId, sku, name, category, unitOfMeasure, price, isActive, branchAvailability]
      properties:
        publicId: { type: string, format: uuid }
        sku: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        category: { $ref: '#/components/schemas/ProductCategory' }
        unitOfMeasure: { type: string, enum: [litre, kilogram, gram, piece] }
        price: { type: number, format: double, minimum: 0.01, multipleOf: 0.01 }
        isActive: { type: boolean }
        branchAvailability:
          type: array
          items: { $ref: '#/components/schemas/BranchAvailability' }
    Branch:
      type: object
      required: [publicId, code, name, city, state, isActive]
      properties:
        publicId: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        city: { type: string }
        state: { type: string }
        isActive: { type: boolean }
    UpsertProductRequest:
      type: object
      required: [sku, name, categoryId, unitOfMeasure, price]
      properties:
        sku: { type: string, maxLength: 80 }
        name: { type: string, maxLength: 160 }
        description: { type: string, nullable: true, maxLength: 1000 }
        categoryId: { type: string, format: uuid }
        unitOfMeasure: { type: string, enum: [litre, kilogram, gram, piece] }
        price: { type: number, format: double, exclusiveMinimum: 0, multipleOf: 0.01 }
    UpsertProductCategoryRequest:
      type: object
      required: [code, name]
      properties:
        code: { type: string, maxLength: 40 }
        name: { type: string, maxLength: 120 }
        description: { type: string, nullable: true, maxLength: 500 }
    SetProductBranchAvailabilityRequest:
      type: object
      required: [branchId, isAvailable]
      properties:
        branchId: { type: string, format: uuid }
        isAvailable: { type: boolean }
        maxDailyQuantity: { type: number, format: double, nullable: true, exclusiveMinimum: 0, multipleOf: 0.001 }
    UpdateCustomerProfileRequest:
      type: object
      properties:
        firstName: { type: string, maxLength: 100, nullable: true }
        lastName: { type: string, maxLength: 100, nullable: true }
        dateOfBirth: { type: string, format: date, nullable: true }
        gender: { type: string, maxLength: 40, nullable: true }
        alternateMobile: { type: string, maxLength: 20, nullable: true }
    CustomerAddressRequest:
      type: object
      required: [label, addressLine1, locality, city, state, pinCode, contactName, contactMobile, latitude, longitude, isDefault]
      properties:
        label: { type: string, maxLength: 80 }
        addressLine1: { type: string, maxLength: 200 }
        addressLine2: { type: string, maxLength: 200, nullable: true }
        locality: { type: string, maxLength: 120 }
        city: { type: string, maxLength: 100 }
        state: { type: string, maxLength: 100 }
        pinCode: { type: string, pattern: '^[1-9][0-9]{5}$' }
        landmark: { type: string, maxLength: 160, nullable: true }
        deliveryInstructions: { type: string, maxLength: 500, nullable: true }
        contactName: { type: string, maxLength: 160 }
        contactMobile: { type: string, maxLength: 20 }
        latitude: { type: number, format: double, minimum: -90, maximum: 90 }
        longitude: { type: number, format: double, minimum: -180, maximum: 180 }
        isDefault: { type: boolean }
    AddressLookupResult:
      type: object
      nullable: true
      properties:
        addressLine1: { type: string, nullable: true }
        locality: { type: string, nullable: true }
        city: { type: string, nullable: true }
        state: { type: string, nullable: true }
        pinCode: { type: string, nullable: true }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
    CheckoutRequest:
      type: object
      required: [addressId, items]
      properties:
        addressId:
          type: string
          format: uuid
        items:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: object
            required: [productId, quantity]
            properties:
              productId:
                type: string
                format: uuid
              quantity:
                type: number
                format: double
                minimum: 0.001
                multipleOf: 0.001
    CreateComplaintRequest:
      type: object
      required: [categoryId, description]
      properties:
        categoryId:
          type: string
          format: uuid
        description:
          type: string
          minLength: 5
          maxLength: 2000
