        buffaloCount: { type: integer, format: int32, minimum: 0 }
        quantityProduced: { type: number, format: double, minimum: 0.001, multipleOf: 0.001 }
        unit: { type: string, enum: [L] }
        recordedByUserId: { type: integer, format: int64 }
        remarks: { type: string, nullable: true }
