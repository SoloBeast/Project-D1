openapi: 3.0.3
info:
  title: DoodhDirect API
  version: 1.0.0
  description: Farm-to-home dairy platform API.
servers:
  - url: https://api.example.com/api/v1
paths:
  /customers/me:
    get:
      summary: Get the authenticated customer's profile
      security:
        - bearerAuth: []
      responses:
        '200': { description: Customer profile envelope }
        '401': { description: Authentication required }
    patch:
      summary: Update the authenticated customer's profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerProfileRequest'
      responses:
        '200': { description: Updated customer profile envelope }
        '400': { description: Validation error }
  /customers/me/addresses:
    get:
      summary: List the authenticated customer's active addresses
      security:
        - bearerAuth: []
      responses:
        '200': { description: Address list envelope }
    post:
      summary: Create an address for the authenticated customer
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerAddressRequest'
      responses:
        '200': { description: Created address envelope }
        '400': { description: Validation error }
  /customers/me/addresses/{addressId}:
    get:
      summary: Get one owned customer address
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/addressId'
      responses:
        '200': { description: Address envelope }
        '404': { description: Address not found }
    patch:
      summary: Update one owned customer address
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/addressId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerAddressRequest'
      responses:
        '200': { description: Updated address envelope }
        '400': { description: Validation error }
        '404': { description: Address not found }
    delete:
      summary: Deactivate one owned customer address
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/addressId'
      responses:
        '200': { description: Address deactivated }
        '404': { description: Address not found }
  /customers/me/address-lookup/reverse:
    get:
      summary: Reverse geocode a map pin for address entry
      security:
        - bearerAuth: []
      parameters:
        - name: latitude
          in: query
          required: true
          schema: { type: number, format: double, minimum: -90, maximum: 90 }
        - name: longitude
          in: query
          required: true
          schema: { type: number, format: double, minimum: -180, maximum: 180 }
      responses:
        '200': { description: Optional provider lookup result }
        '400': { description: Invalid coordinates }
  /admin/customers/{customerId}/profile:
    get:
      summary: Read a customer profile
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/customerId'
      responses:
        '200': { description: Customer profile envelope }
        '403': { description: Missing customer read permission }
    patch:
      summary: Manage a customer profile
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/customerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerProfileRequest'
      responses:
        '200': { description: Updated customer profile envelope }
        '403': { description: Missing customer manage permission }
  /admin/customers/{customerId}/addresses:
    get:
      summary: Read customer addresses
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/customerId'
      responses:
        '200': { description: Address list envelope }
    post:
      summary: Create a customer address
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/customerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerAddressRequest'
      responses:
        '200': { description: Created address envelope }
  /admin/customers/{customerId}/addresses/{addressId}:
    get:
      summary: Read one customer address
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/customerId'
        - $ref: '#/components/parameters/addressId'
      responses:
        '200': { description: Address envelope }
    patch:
      summary: Update one customer address
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/customerId'
        - $ref: '#/components/parameters/addressId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerAddressRequest'
      responses:
        '200': { description: Updated address envelope }
    delete:
      summary: Deactivate one customer address
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/customerId'
        - $ref: '#/components/parameters/addressId'
      responses:
        '200': { description: Address deactivated }
  /auth/send-otp:
    post:
      summary: Send OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mobile]
              properties:
                mobile:
                  type: string
                  example: "+919876543210"
      responses:
        '202':
          description: OTP request accepted
  /products:
    get:
      summary: List active catalogue products
      description: Anonymous catalogue read. Results require an active product, active category, and an available active branch.
      security: []
      parameters:
        - $ref: '#/components/parameters/categoryIdQuery'
      responses:
        '200': { description: Product list envelope }
  /products/{productId}:
    get:
      summary: Get one active catalogue product
      security: []
      parameters:
        - $ref: '#/components/parameters/productId'
      responses:
        '200': { description: Product envelope }
        '404': { description: Product not found or unavailable }
  /product-categories:
    get:
      summary: List active product categories
      security: []
      responses:
        '200': { description: Category list envelope }
  /admin/products:
    get:
      summary: List products for catalogue administration
      security:
        - bearerAuth: []
      responses:
        '200': { description: Product list envelope }
        '403': { description: Missing CATALOGUE.READ permission }
    post:
      summary: Create a catalogue product
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertProductRequest'
      responses:
        '200': { description: Created product envelope }
        '400': { description: Validation error }
        '403': { description: Missing CATALOGUE.MANAGE permission }
        '409': { description: Duplicate SKU }
  /admin/products/{productId}:
    get:
      summary: Get one product for catalogue administration
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/productId'
      responses:
        '200': { description: Product envelope }
        '403': { description: Missing CATALOGUE.READ permission }
        '404': { description: Product not found }
    patch:
      summary: Update a catalogue product
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/productId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertProductRequest'
      responses:
        '200': { description: Updated product envelope }
        '400': { description: Validation error }
        '403': { description: Missing CATALOGUE.MANAGE permission }
        '404': { description: Product not found }
        '409': { description: Duplicate SKU }
  /admin/products/{productId}/activate:
    post:
      summary: Activate a catalogue product
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/productId'
      responses:
        '200': { description: Product envelope }
        '403': { description: Missing CATALOGUE.MANAGE permission }
        '422': { description: Active category required }
  /admin/products/{productId}/deactivate:
    post:
      summary: Deactivate a catalogue product
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/productId'
      responses:
        '200': { description: Product envelope }
        '403': { description: Missing CATALOGUE.MANAGE permission }
  /admin/products/{productId}/branches:
    put:
      summary: Set product availability for a branch
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/productId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetProductBranchAvailabilityRequest'
      responses:
        '200': { description: Updated product envelope }
        '400': { description: Validation error }
        '403': { description: Missing CATALOGUE.MANAGE permission }
        '404': { description: Product or branch not found }
  /admin/product-categories:
    get:
      summary: List all categories for catalogue administration
      security:
        - bearerAuth: []
      responses:
        '200': { description: Category list envelope }
        '403': { description: Missing CATALOGUE.READ permission }
    post:
      summary: Create a product category
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertProductCategoryRequest'
      responses:
        '200': { description: Created category envelope }
        '400': { description: Validation error }
        '403': { description: Missing CATALOGUE.MANAGE permission }
        '409': { description: Duplicate category code }
  /admin/product-categories/{categoryId}:
    patch:
      summary: Update a product category
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/categoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertProductCategoryRequest'
      responses:
        '200': { description: Updated category envelope }
        '400': { description: Validation error }
        '403': { description: Missing CATALOGUE.MANAGE permission }
        '404': { description: Category not found }
  /admin/product-categories/{categoryId}/activate:
    post:
      summary: Activate a product category
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/categoryId'
      responses:
        '200': { description: Category envelope }
        '403': { description: Missing CATALOGUE.MANAGE permission }
  /admin/product-categories/{categoryId}/deactivate:
    post:
      summary: Deactivate a product category
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/categoryId'
      responses:
        '200': { description: Category envelope }
        '403': { description: Missing CATALOGUE.MANAGE permission }
  /admin/branches:
    get:
      summary: List branches for catalogue administration
      security:
        - bearerAuth: []
      responses:
        '200': { description: Branch list envelope }
        '403': { description: Missing CATALOGUE.READ permission }
  /branches/serviceability:
    get:
      summary: Check serviceability and eligible branches
      security:
        - bearerAuth: []
      parameters:
        - name: latitude
          in: query
          required: true
          schema: { type: number, format: double }
        - name: longitude
          in: query
          required: true
          schema: { type: number, format: double }
      responses:
        '200':
          description: Serviceability result
  /orders/checkout-preview:
    post:
      summary: Calculate authoritative checkout totals and allocate the nearest eligible branch
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '200': { description: Checkout preview with backend prices, totals, and branch allocation }
        '404': { description: Selected owned active address not found }
        '422': { description: Product or branch allocation business rule failure }
  /orders:
    post:
      summary: Create a confirmed one-time order
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '201': { description: Idempotent order result }
        '404': { description: Selected owned active address not found }
        '422': { description: Product or branch allocation business rule failure }
    get:
      summary: List the authenticated customer's orders
      security:
        - bearerAuth: []
      responses:
        '200': { description: Ownership-scoped order list }
  /orders/{orderId}:
    get:
      summary: Get an owned order
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/orderId'
      responses:
        '200': { description: Historical order snapshot }
        '404': { description: Owned order not found }
  /orders/{orderId}/cancel:
    post:
      summary: Cancel an owned eligible order
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/orderId'
      responses:
        '200': { description: Cancelled order snapshot }
        '404': { description: Owned order not found }
        '422': { description: Order status cannot transition to cancelled }
  /admin/orders:
    get:
      summary: List orders for authorized administration
      security:
        - bearerAuth: []
      responses:
        '200': { description: Administrative order list }
        '403': { description: Missing ORDERS.READ permission }
  /admin/orders/{orderId}:
    get:
      summary: Get an order for authorized administration
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/orderId'
      responses:
        '200': { description: Historical order snapshot }
        '403': { description: Missing ORDERS.READ permission }
        '404': { description: Order not found }
  /orders/{orderId}/complaints:
    post:
      summary: Create complaint for delivered order
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/orderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateComplaintRequest'
      responses:
        '201': { description: Complaint created }
        '422': { description: Complaint window/business rule failure }
  /subscriptions:
    get:
      summary: List the authenticated customer's subscriptions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Ownership-scoped subscription list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Create a prepaid finite-entitlement subscription
      description: Creates one subscription and its single associated Wallet or Razorpay payment. Retrying the same request requires the same idempotency key.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSubscriptionRequest' }
      responses:
        '201':
          description: Subscription and its reusable payment were created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedSubscriptionResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/BusinessRuleError' }
  /subscriptions/{subscriptionId}:
    get:
      summary: Get an owned subscription
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/subscriptionId'
      responses:
        '200':
          description: Subscription snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Update an owned eligible subscription
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/subscriptionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateSubscriptionRequest' }
      responses:
        '200':
          description: Updated subscription snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/BusinessRuleError' }
  /subscriptions/{subscriptionId}/pause:
    post:
      summary: Pause an owned active subscription
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/subscriptionId'
      responses:
        '200':
          description: Paused subscription snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/BusinessRuleError' }
  /subscriptions/{subscriptionId}/resume:
    post:
      summary: Resume an owned paused subscription
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/subscriptionId'
      responses:
        '200':
          description: Resumed subscription snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/BusinessRuleError' }
  /subscriptions/{subscriptionId}/cancel:
    post:
      summary: Cancel an owned eligible subscription
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/subscriptionId'
      responses:
        '200':
          description: Cancelled subscription snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/BusinessRuleError' }
  /subscriptions/{subscriptionId}/skip:
    post:
      summary: Skip one scheduled delivery for an owned subscription
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/subscriptionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SkipSubscriptionDeliveryRequest' }
      responses:
        '200':
          description: Skipped subscription delivery snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionDeliveryResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/BusinessRuleError' }
  /subscriptions/{subscriptionId}/calendar:
    get:
      summary: List the delivery calendar and history for an owned subscription
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/subscriptionId'
      responses:
        '200':
          description: Subscription delivery calendar and history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionDeliveryListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /deliveries:
    get:
      summary: List deliveries owned by the authenticated customer
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Customer-safe delivery snapshots
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerDeliveryListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /deliveries/{deliveryId}:
    get:
      summary: Get an owned delivery with customer-safe tracking data
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/deliveryId'
      responses:
        '200':
          description: Customer-safe delivery snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerDeliveryResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /delivery/my-today:
    get:
      summary: List deliveries assigned to the authenticated delivery employee
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/deliveryDate'
      responses:
        '200':
          description: Assigned deliveries for the requested date, or today when omitted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryListResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /delivery/{deliveryId}:
    get:
      summary: Get an assigned delivery for operational use
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/deliveryId'
      responses:
        '200':
          description: Operational delivery snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /delivery/{deliveryId}/pickup:
    post:
      summary: Mark an assigned delivery as picked up
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/deliveryId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeliveryNotesRequest' }
      responses:
        '200':
          description: Updated delivery
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/BusinessRuleError' }
  /delivery/{deliveryId}/start:
    post:
      summary: Start an assigned delivery
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/deliveryId'
      responses:
        '200':
          description: Updated delivery
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/BusinessRuleError' }
  /delivery/{deliveryId}/arrive:
    post:
      summary: Mark an assigned delivery as arrived
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/deliveryId'
      responses:
        '200':
          description: Updated delivery
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/BusinessRuleError' }
  /delivery/{deliveryId}/issue-otp:
    post:
      summary: Issue an OTP to the customer for an arrived delivery
      description: The plaintext OTP and stored OTP hash are never returned by the API.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/deliveryId'
      responses:
        '200':
          description: OTP issuance accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryOtpIssuedResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/BusinessRuleError' }
