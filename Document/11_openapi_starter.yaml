    post:
      summary: Generate eligible delivery work through an operational date
      description: Available to DELIVERY_MANAGER and DAIRY_MANAGER with DELIVERIES.ASSIGN_BRANCH. Idempotently creates missing delivery rows for eligible confirmed one-time orders and active scheduled subscription occurrences. The authenticated actor remains the audit actor and branch scope is enforced; DAIRY_MANAGER does not receive ACCESS.GLOBAL.
