      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties: { data: { $ref: '#/components/schemas/NumberSeries' } }
    NumberSeriesListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
