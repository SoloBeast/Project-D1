        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/BusinessRuleError' }
  /delivery-management/fetch-subscriptions:
    post:
      summary: Generate eligible subscription deliveries through an operational date
      description: Available to DELIVERY_MANAGER and DAIRY_MANAGER with DELIVERIES.ASSIGN_BRANCH. Idempotently creates only active scheduled subscription occurrence deliveries. The authenticated actor and branch scope are preserved.
