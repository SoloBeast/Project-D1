    get:
      tags: [Notifications]
      summary: List the authenticated user's notifications
      description: Returns a newest-first, ownership-scoped page. The optional read-state filter is server enforced.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/notificationPage'
        - $ref: '#/components/parameters/notificationPageSize'
        - $ref: '#/components/parameters/notificationIsRead'
      responses:
        '200':
          description: Ownership-scoped notification page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPageResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /notifications/unread-count:
    get:
      tags: [Notifications]
      summary: Get the authenticated user's unread notification count
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Server-authoritative unread count
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationUnreadCountResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /notifications/{notificationId}/read:
    post:
      tags: [Notifications]
      summary: Mark an owned notification as read
      description: Unknown and non-owned notification identifiers return the same not-found response.
