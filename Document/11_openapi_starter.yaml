        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /devices:
    post:
      tags: [Notification devices]
      summary: Register or rotate a push-notification device token
      description: The push token is accepted only over authenticated transport and is never returned by this API.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterNotificationDeviceRequest' }
      responses:
        '200':
