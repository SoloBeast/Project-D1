          type: string
          minLength: 5
          maxLength: 2000
    NumberSeriesResetPolicy:
      type: string
      enum: [Never, Daily, Monthly, CalendarYear, FinancialYear]
      description: Financial-year resets use the India financial year starting 1 April.
    NumberSeries:
      type: object
      required: [code, description, template, startingNumber, lastUsedNumber, incrementBy, resetPolicy, isActive, nextNumber]
      properties:
        code: { type: string, minLength: 1, maxLength: 40, description: Stable lookup key used by business services; immutable after creation. }
        description: { type: string, minLength: 1, maxLength: 200 }
        template:
          type: string
          minLength: 1
          maxLength: 200
          description: >-
            Literal text with exactly one {NUMBER:...} counter token plus
            optional {PREFIX}, {FY}, {YEAR}, {YY}, {MONTH}, and {DATE:...}
            tokens.
        startingNumber: { type: integer, format: int64, minimum: 1 }
        lastUsedNumber: { type: integer, format: int64, minimum: 0 }
        incrementBy: { type: integer, format: int32, minimum: 1 }
        resetPolicy: { $ref: '#/components/schemas/NumberSeriesResetPolicy' }
        isActive: { type: boolean }
        nextNumber: { type: string, nullable: true, description: The next number that would be allocated without consuming it. }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        createdByUserId: { type: integer, format: int64, nullable: true }
        updatedByUserId: { type: integer, format: int64, nullable: true }
    CreateNumberSeriesRequest:
      type: object
      required: [code, description, template, startingNumber, incrementBy, resetPolicy]
      properties:
        code: { type: string, minLength: 1, maxLength: 40 }
        description: { type: string, minLength: 1, maxLength: 200 }
        template: { type: string, minLength: 1, maxLength: 200 }
        startingNumber: { type: integer, format: int64, minimum: 1 }
        incrementBy: { type: integer, format: int32, minimum: 1 }
        resetPolicy: { $ref: '#/components/schemas/NumberSeriesResetPolicy' }
    UpdateNumberSeriesRequest:
      type: object
      required: [description, template, startingNumber, incrementBy, resetPolicy]
      properties:
        description: { type: string, minLength: 1, maxLength: 200 }
        template: { type: string, minLength: 1, maxLength: 200 }
        startingNumber: { type: integer, format: int64, minimum: 1 }
        incrementBy: { type: integer, format: int32, minimum: 1 }
        resetPolicy: { $ref: '#/components/schemas/NumberSeriesResetPolicy' }
    NumberSeriesPreviewRequest:
      type: object
      required: [code, template]
      properties:
        code: { type: string, minLength: 1, maxLength: 40 }
        template: { type: string, minLength: 1, maxLength: 200 }
        nextNumber: { type: integer, format: int64, nullable: true, minimum: 1, description: Optional override; the live series counter is never advanced. }
    NumberSeriesPreview:
      type: object
      required: [code, template, nextNumber, formattedNumber]
      properties:
        code: { type: string }
        template: { type: string }
        nextNumber: { type: integer, format: int64 }
        formattedNumber: { type: string }
