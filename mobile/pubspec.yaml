name: doodh_direct_mobile
description: DoodhDirect role-aware application for Android, iOS, and web.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.2.1
  flutter_secure_storage: ^9.2.4
  go_router: ^17.1.0
  http: ^1.6.0
  http_parser: ^4.1.2
  image_picker: ^1.2.3
  razorpay_flutter: ^1.4.0
  video_player: ^2.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  yaml: ^3.1.3

flutter:
  uses-material-design: true
